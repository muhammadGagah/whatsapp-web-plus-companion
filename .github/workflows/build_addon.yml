name: build addon

on:
  push:
    tags: ["*"]
    # To build on main/master branch, uncomment the following line:
    # branches: [ main , master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
  workflow_call:

jobs:
  test:
    # The add-on uses Windows-only APIs such as winreg and PowerShell.
    if: github.repository != 'nvaccess/addonTemplate'
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run unit tests
      run: uv run --python ${{ matrix.python-version }} python -m unittest discover -s tests -v

  build:
    # Building the add-on template as an add-on does not make sense (and fails).
    # Do not modify this repo name with your own one! (should remain the template)
    if: github.repository != 'nvaccess/addonTemplate'

    needs: ["test"]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        sudo apt-get update  -y
        sudo apt-get install -y gettext
        uv sync

    - name: Code checks
      run: export PREK_SKIP=no-commit-to-branch; uv run prek run --all-files

    - name: Verify release source and tag
      run: uv run python scripts/verify-release.py --source-only

    - name: Build add-on
      run: uv run scons && uv run scons pot && uv run python scripts/verify-release.py --artifacts-dir .

    - uses: actions/upload-artifact@v7
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        name: translation_template
        path: |
          ./*.pot
        archive: false

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: .
        merge-multiple: true
    - name: Display structure of downloaded files
      run: ls -R
    - name: Verify downloaded release package
      run: python3 scripts/verify-release.py --artifacts-dir .
    - name: Calculate sha256
      run: |
        echo -e "\nSHA256: " >> changelog.md
        sha256sum *.nvda-addon >> changelog.md

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          *.nvda-addon
          *.pot
        body_path: changelog.md
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref, '-') }}
