name: Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    name: Run Unit Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite via unittest
        run: uv run --python ${{ matrix.python-version }} python -m unittest discover -s tests -v
      - name: Check native recording source and WAV output
        run: powershell.exe -NoProfile -NonInteractive -Mta -ExecutionPolicy Bypass -File tests/test-recording-native.ps1
